name: Update project previews

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '**.kicad_sch'
      - '**.kicad_pcb'
      - '**.kicad_pro'
      - '**.kicad_sym'
      - '**.kicad_mod'
      - '**.stp'
      - '**.step'
      - '*-lib-table'
      - 'scripts/**'
      - '.github/workflows/previews.yml'

permissions:
  contents: write

concurrency:
  group: previews-${{ github.ref }}
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-24.04
    container:
      image: ghcr.io/kicad/kicad:10.0.8-full
      options: --user root
    steps:
      - uses: actions/checkout@v4
      - name: Generate images and audit BOM
        run: python3 scripts/update_previews.py
      - name: Commit generated previews
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git add docs/images docs/bom.csv
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Update project previews and BOM'
          git push
